<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      .fl-navy-bg { fill: #0B1E36; }
      .fl-white-bg { fill: #FFFFFF; }
      .fl-gray-bg { fill: #F4F7FA; }
      .fl-cyan { fill: #00A8B5; }
      .fl-navy-text { fill: #0B1E36; font-family: 'Outfit', 'Montserrat', sans-serif; }
      .fl-white-text { fill: #FFFFFF; font-family: 'Outfit', 'Montserrat', sans-serif; }
      .fl-stroke-cyan { stroke: #00A8B5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <clipPath id="shirtClip">
      <path d="M 320 0 Q 300 250 420 380 Q 500 460 600 480 L 600 0 Z" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" class="fl-white-bg" rx="16" />

  <!-- Top Curved Image Area (Shirt Graphic Representation) -->
  <path d="M 280 0 C 260 220 380 340 600 380 L 600 0 Z" fill="#EBF7F8" />
  
  <!-- Hanger and Shirt Visual Graphic -->
  <g transform="translate(360, 40) scale(1.4)">
    <path d="M 80,40 C 80,20 100,15 110,25 C 115,30 108,42 98,46" stroke="#00A8B5" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- White shirt mockup shape -->
    <path d="M 40,90 L 80,60 L 120,90 L 150,80 L 165,160 L 140,160 L 140,280 L 20,280 L 20,160 L -5,160 L 10,80 Z" fill="#FFFFFF" stroke="#0B1E36" stroke-width="3" />
    <!-- Collar & Placket -->
    <path d="M 55,70 L 80,100 L 105,70" stroke="#0B1E36" stroke-width="3" fill="none" />
    <line x1="80" y1="100" x2="80" y2="280" stroke="#0B1E36" stroke-width="3" />
    <!-- Pocket -->
    <rect x="35" y="130" width="30" height="35" rx="3" fill="none" stroke="#00A8B5" stroke-width="2.5" />
  </g>

  <!-- Logo Top Left -->
  <g transform="translate(30, 40)">
    <text x="0" y="32" class="fl-navy-text" font-size="34" font-weight="800" letter-spacing="2">ABIBA</text>
    <text x="0" y="58" class="fl-navy-text" font-size="16" font-weight="700" letter-spacing="6">PRESSING</text>
    <line x1="0" y1="68" x2="160" y2="68" stroke="#00A8B5" stroke-width="3" />
    <g transform="translate(0, 78)">
      <path d="M 6,10 C 6,4 12,2 15,6" stroke="#00A8B5" stroke-width="2" fill="none" />
      <text x="16" y="10" class="fl-navy-text" font-size="11" font-weight="600" letter-spacing="1">📍 DOUALA, CAMEROUN</text>
    </g>
  </g>

  <!-- Main Headline -->
  <g transform="translate(30, 200)">
    <text class="fl-navy-text" font-size="34" font-weight="900" y="0">VOS VÊTEMENTS</text>
    <text class="fl-navy-text" font-size="34" font-weight="900" y="42">MÉRITENT LE</text>
    <text class="fl-navy-text" font-size="34" font-weight="900" y="84">MEILLEUR SOIN<tspan fill="#00A8B5">.</tspan></text>
  </g>

  <!-- 4 Services Bullet Points -->
  <g transform="translate(30, 360)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#E6F6F7" />
      <!-- Washing machine icon -->
      <rect x="8" y="8" width="20" height="20" rx="3" stroke="#00A8B5" stroke-width="2" fill="none" />
      <circle cx="18" cy="19" r="6" stroke="#00A8B5" stroke-width="1.5" fill="none" />
      <circle cx="12" cy="12" r="1.5" fill="#00A8B5" />
      <text x="48" y="18" class="fl-navy-text" font-size="14" font-weight="700">Nettoyage</text>
      <text x="48" y="32" class="fl-navy-text" font-size="14" font-weight="700">professionnel</text>
      <line x1="0" y1="46" x2="160" y2="46" stroke="#00A8B5" stroke-width="1" opacity="0.4" />
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#E6F6F7" />
      <!-- Iron icon -->
      <path d="M 8,24 L 28,24 C 28,18 24,14 16,14 L 8,14 Z" stroke="#00A8B5" stroke-width="2" fill="none" />
      <path d="M 12,14 L 12,10 L 22,10" stroke="#00A8B5" stroke-width="2" fill="none" />
      <text x="48" y="18" class="fl-navy-text" font-size="14" font-weight="700">Repassage</text>
      <text x="48" y="32" class="fl-navy-text" font-size="14" font-weight="700">soigné</text>
      <line x1="0" y1="46" x2="160" y2="46" stroke="#00A8B5" stroke-width="1" opacity="0.4" />
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#E6F6F7" />
      <!-- Sparkle shirt icon -->
      <path d="M 10,12 L 18,8 L 26,12 L 24,26 L 12,26 Z" stroke="#00A8B5" stroke-width="2" fill="none" />
      <path d="M 27,8 L 29,12 L 31,8 L 29,4 Z" fill="#00A8B5" />
      <text x="48" y="18" class="fl-navy-text" font-size="14" font-weight="700">Finition</text>
      <text x="48" y="32" class="fl-navy-text" font-size="14" font-weight="700">impeccable</text>
      <line x1="0" y1="46" x2="160" y2="46" stroke="#00A8B5" stroke-width="1" opacity="0.4" />
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#E6F6F7" />
      <!-- Care hands icon -->
      <path d="M 8,22 Q 18,14 28,22" stroke="#00A8B5" stroke-width="2" fill="none" />
      <path d="M 10,26 C 14,29 22,29 26,26" stroke="#00A8B5" stroke-width="2" fill="none" />
      <text x="48" y="18" class="fl-navy-text" font-size="14" font-weight="700">Soin de vos</text>
      <text x="48" y="32" class="fl-navy-text" font-size="14" font-weight="700">vêtements</text>
    </g>
  </g>

  <!-- Cyan WhatsApp CTA capsule -->
  <g transform="translate(30, 600)">
    <rect width="540" height="54" rx="27" fill="#00A8B5" />
    <!-- WhatsApp Icon inside capsule -->
    <circle cx="38" cy="27" r="16" fill="#FFFFFF" />
    <path d="M 38,17 C 32.5,17 28,21.5 28,27 C 28,28.8 28.5,30.5 29.3,32 L 28,37 L 33.2,35.7 C 34.6,36.5 36.3,37 38,37 C 43.5,37 48,32.5 48,27 C 48,21.5 43.5,17 38,17 Z" fill="#00A8B5" />
    <text x="68" y="24" class="fl-white-text" font-size="13" font-weight="800">BESOIN D'UN PRESSING DE CONFIANCE ?</text>
    <text x="68" y="40" class="fl-white-text" font-size="12" font-weight="600">APPELEZ-NOUS OU ÉCRIVEZ-NOUS SUR WHATSAPP.</text>
  </g>

  <!-- Dark Navy Bottom Footer Bar -->
  <path d="M 0 675 Q 300 660 600 675 L 600 800 L 0 800 Z" class="fl-navy-bg" />
  <g transform="translate(30, 725)">
    <!-- Phone icon -->
    <path d="M 0,5 C 0,3 2,0 5,0 L 12,0 C 14,0 15,2 15,4 L 17,9 C 18,11 17,13 15,14 L 12,16 C 15,22 20,27 26,30 L 28,27 C 29,25 31,24 33,25 L 38,27 C 40,27 42,29 42,31 L 42,38 C 42,41 39,43 36,43 C 16,43 0,27 0,5 Z" fill="#00A8B5" transform="scale(0.6)" />
    <text x="36" y="20" class="fl-white-text" font-size="24" font-weight="900" letter-spacing="1">686 159 044 / 655 079 338</text>
    
    <!-- Location -->
    <g transform="translate(0, 36)">
      <circle cx="8" cy="8" r="5" fill="#00A8B5" />
      <text x="22" y="12" class="fl-white-text" font-size="13" font-weight="600" letter-spacing="1">AKWA — À CÔTÉ DE L'HÔTEL MON VOISIN</text>
    </g>
  </g>
</svg>
